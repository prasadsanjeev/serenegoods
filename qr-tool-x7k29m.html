<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper:      #F4F6F3;
  --paper-2:    #FBFCFA;
  --card:       #FFFFFF;
  --ink:        #16241F;
  --ink-soft:   #4C5C54;
  --ink-faint:  #7A887F;
  --pine:       #1E3D35;
  --pine-deep:  #142C26;
  --sage:       #8AA396;
  --sage-soft:  #E5ECE6;
  --honey:      #D9924B;
  --honey-deep: #BE7833;
  --line:       #DCE3DC;
  --line-soft:  #E8EDE8;

  --maxw: 720px;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow-sm: 0 1px 2px rgba(20,44,38,.04), 0 4px 14px rgba(20,44,38,.05);
  --shadow-md: 0 6px 28px rgba(20,44,38,.10);
  --ease: cubic-bezier(.22,.61,.36,1);

  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
  font-size: 17px;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding: 48px 20px 80px;
}

.wrap { max-width: var(--maxw); margin: 0 auto; }

header { margin-bottom: 32px; text-align: center; }
h1 {
  font-family: var(--font-display);
  font-size: clamp(28px, 4vw, 38px);
  font-weight: 500;
  color: var(--pine-deep);
  letter-spacing: -0.01em;
}
header p { color: var(--ink-soft); margin-top: 8px; font-size: 15px; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 28px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 8px;
}

textarea, select, input[type="text"] {
  width: 100%;
  font-family: var(--font-body);
  font-size: 16px;
  color: var(--ink);
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  resize: vertical;
}
textarea:focus, select:focus, input[type="text"]:focus {
  outline: none;
  border-color: var(--sage);
}

.row { margin-bottom: 20px; }
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }

button {
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  border-radius: 999px;
  padding: 12px 22px;
  border: none;
  cursor: pointer;
  transition: transform .15s var(--ease), background .15s var(--ease);
}
button:active { transform: scale(0.97); }

.btn-primary { background: var(--pine); color: #fff; }
.btn-primary:hover { background: var(--pine-deep); }

.btn-secondary { background: var(--sage-soft); color: var(--pine-deep); }
.btn-secondary:hover { background: var(--sage); color: #fff; }

.btn-secondary:disabled, .btn-primary:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.preview {
  margin-top: 28px;
  text-align: center;
}
.preview .qr-box {
  display: inline-block;
  background: #fff;
  padding: 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}
.preview canvas { display: block; image-rendering: pixelated; }
.preview p.hint { color: var(--ink-faint); font-size: 13px; margin-top: 14px; }

.error {
  color: var(--honey-deep);
  font-size: 14px;
  margin-top: 10px;
  display: none;
}
.error.show { display: block; }

footer {
  text-align: center;
  margin-top: 40px;
  color: var(--ink-faint);
  font-size: 13px;
}

@media (max-width: 480px) {
  .grid-2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>QR Code Generator</h1>
    <p>Create a QR code from any text or URL, then download it in high resolution.</p>
  </header>

  <div class="card">
    <div class="row">
      <label for="qr-text">Text or URL</label>
      <textarea id="qr-text" rows="3" placeholder="https://example.com">https://serenegoods.com</textarea>
    </div>

    <div class="grid-2 row">
      <div>
        <label for="qr-ecc">Error correction</label>
        <select id="qr-ecc">
          <option value="L">Low (L)</option>
          <option value="M" selected>Medium (M)</option>
          <option value="Q">Quartile (Q)</option>
          <option value="H">High (H)</option>
        </select>
      </div>
      <div>
        <label for="qr-size">Download size (px)</label>
        <select id="qr-size">
          <option value="512">512 × 512</option>
          <option value="1024" selected>1024 × 1024</option>
          <option value="2048">2048 × 2048</option>
          <option value="4096">4096 × 4096 (max quality)</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="generate-btn" type="button">Generate QR Code</button>
      <button class="btn-secondary" id="download-png-btn" type="button" disabled>Download PNG</button>
      <button class="btn-secondary" id="download-svg-btn" type="button" disabled>Download SVG</button>
    </div>
    <p class="error" id="error-msg"></p>

    <div class="preview" id="preview" style="display:none;">
      <div class="qr-box">
        <canvas id="qr-canvas" width="240" height="240"></canvas>
      </div>
      <p class="hint">Preview shown at reduced size — downloads use your selected resolution.</p>
    </div>
  </div>

  <footer>This page is unlisted and not linked from the site navigation.</footer>
</div>

    getMask: function(maskPattern, i, j) {

        case QRMaskPattern.PATTERN001: return i % 2 == 0;
        case QRMaskPattern.PATTERN010: return j % 3 == 0;
        case QRMaskPattern.PATTERN011: return (i + j) % 3 == 0;
        case QRMaskPattern.PATTERN100: return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 == 0;

      for (var row = 0; row < moduleCount; row++) {

      for (var col = 0; col < moduleCount; col++) {

          }
        }
      }
      var darkCount = 0;
      for (var col = 0; col < moduleCount; col++) {

  function QRRSBlock(totalCount, dataCount) {
    this.totalCount = totalCount;
    this.dataCount = dataCount;
  }
  QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
    var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
    if (rsBlock == undefined) throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
    var length = rsBlock.length / 3;
    var list = [];
    for (var i = 0; i < length; i++) {
      var count = rsBlock[i * 3 + 0];
      var totalCount = rsBlock[i * 3 + 1];
      var dataCount = rsBlock[i * 3 + 2];
      for (var j = 0; j < count; j++) list.push(new QRRSBlock(totalCount, dataCount));
    }
    return list;
  };
  QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {
    switch (errorCorrectLevel) {
      case QRErrorCorrectLevel.L: return RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
      case QRErrorCorrectLevel.M: return RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
      case QRErrorCorrectLevel.Q: return RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
      case QRErrorCorrectLevel.H: return RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
      default: return undefined;
    }
  };

  function QRBitBuffer() {
    this.buffer = [];
    this.length = 0;
  }

    get: function(index) {
      var bufIndex = Math.floor(index / 8);
      return ((this.buffer[bufIndex] >>> (7 - index % 8)) & 1) == 1;
    },
    put: function(num, length) {
      for (var i = 0; i < length; i++) this.putBit(((num >>> (length - i - 1)) & 1) == 1);
    },
    getLengthInBits: function() { return this.length; },
    putBit: function(bit) {
      var bufIndex = Math.floor(this.length / 8);
      if (this.buffer.length <= bufIndex) this.buffer.push(0);
      if (bit) this.buffer[bufIndex] |= (0x80 >>> (this.length % 8));
      this.length++;
    }
  };

  function QR8bitByte(data) {
    this.mode = QRMode.MODE_8BIT_BYTE;
    this.data = data;
    this.parsedData = [];
    var bytes = qrcode.stringToBytes(data);
    for (var i = 0; i < bytes.length; i++) this.parsedData.push(bytes[i]);
  }
  QR8bitByte.prototype = {
    getLength: function() { return this.parsedData.length; },
    write: function(buffer) {
      for (var i = 0; i < this.parsedData.length; i++) buffer.put(this.parsedData[i], 8);
    }
  };

  function QRCodeModel(typeNumber, errorCorrectLevel) {
    this.typeNumber = typeNumber;
    this.errorCorrectLevel = errorCorrectLevel;
    this.modules = null;
    this.moduleCount = 0;
    this.dataCache = null;
    this.dataList = [];
  }
  QRCodeModel.prototype = {
    addData: function(data) { this.dataList.push(new QR8bitByte(data)); this.dataCache = null; },
    isDark: function(row, col) {
      if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
        throw new Error(row + "," + col);
      }
      return this.modules[row][col];
    },
    getModuleCount: function() { return this.moduleCount; },
    make: function() { this.makeImpl(false, this.getBestMaskPattern()); },
    makeImpl: function(test, maskPattern) {
      this.moduleCount = this.typeNumber * 4 + 17;
      this.modules = new Array(this.moduleCount);
      for (var row = 0; row < this.moduleCount; row++) {
        this.modules[row] = new Array(this.moduleCount);
        for (var col = 0; col < this.moduleCount; col++) this.modules[row][col] = null;
      }
      this.setupPositionProbePattern(0, 0);
      this.setupPositionProbePattern(this.moduleCount - 7, 0);
      this.setupPositionProbePattern(0, this.moduleCount - 7);
      this.setupPositionAdjustPattern();
      this.setupTimingPattern();
      this.setupTypeInfo(test, maskPattern);
      if (this.typeNumber >= 7) this.setupTypeNumber(test);
      if (this.dataCache == null) this.dataCache = QRCodeModel.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
      this.mapData(this.dataCache, maskPattern);
    },
    setupPositionProbePattern: function(row, col) {
      for (var r = -1; r <= 7; r++) {
        if (row + r <= -1 || this.moduleCount <= row + r) continue;
        for (var c = -1; c <= 7; c++) {
          if (col + c <= -1 || this.moduleCount <= col + c) continue;
          if ((0 <= r && r <= 6 && (c == 0 || c == 6)) ||
              (0 <= c && c <= 6 && (r == 0 || r == 6)) ||
              (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
            this.modules[row + r][col + c] = true;
          } else {
            this.modules[row + r][col + c] = false;
          }
        }
      }
    },
    getBestMaskPattern: function() {
      var minLostPoint = 0;
      var pattern = 0;
      for (var i = 0; i < 8; i++) {
        this.makeImpl(true, i);
        var lostPoint = QRUtil.getLostPoint(this);
        if (i == 0 || minLostPoint > lostPoint) { minLostPoint = lostPoint; pattern = i; }
      }
      return pattern;
    },
    setupTimingPattern: function() {
      for (var r = 8; r < this.moduleCount - 8; r++) {
        if (this.modules[r][6] != null) continue;
        this.modules[r][6] = (r % 2 == 0);
      }
      for (var c = 8; c < this.moduleCount - 8; c++) {
        if (this.modules[6][c] != null) continue;
        this.modules[6][c] = (c % 2 == 0);
      }
    },
    setupPositionAdjustPattern: function() {
      var pos = QRUtil.getPatternPosition(this.typeNumber);
      for (var i = 0; i < pos.length; i++) {
        for (var j = 0; j < pos.length; j++) {
          var row = pos[i], col = pos[j];
          if (this.modules[row][col] != null) continue;
          for (var r = -2; r <= 2; r++) {
            for (var c = -2; c <= 2; c++) {
              if (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0)) {
                this.modules[row + r][col + c] = true;
              } else {
                this.modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    },
    setupTypeNumber: function(test) {
      var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
      for (var i = 0; i < 18; i++) {
        var mod = (!test && ((bits >> i) & 1) == 1);
        this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
      }
      for (var i = 0; i < 18; i++) {
        var mod = (!test && ((bits >> i) & 1) == 1);
        this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    },
    setupTypeInfo: function(test, maskPattern) {
      var data = (this.errorCorrectLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);
      for (var i = 0; i < 15; i++) {
        var mod = (!test && ((bits >> i) & 1) == 1);
        if (i < 6) this.modules[i][8] = mod;
        else if (i < 8) this.modules[i + 1][8] = mod;
        else this.modules[this.moduleCount - 15 + i][8] = mod;
      }
      for (var i = 0; i < 15; i++) {
        var mod = (!test && ((bits >> i) & 1) == 1);
        if (i < 8) this.modules[8][this.moduleCount - i - 1] = mod;
        else if (i < 9) this.modules[8][15 - i - 1 + 1] = mod;
        else this.modules[8][15 - i - 1] = mod;
      }
      this.modules[this.moduleCount - 8][8] = (!test);
    },
    mapData: function(data, maskPattern) {
      var inc = -1;
      var row = this.moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      for (var col = this.moduleCount - 1; col > 0; col -= 2) {
        if (col == 6) col--;
        while (true) {
          for (var c = 0; c < 2; c++) {
            if (this.modules[row][col - c] == null) {
              var dark = false;
              if (byteIndex < data.length) dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
              var mask = QRUtil.getMask(maskPattern, row, col - c);
              if (mask) dark = !dark;
              this.modules[row][col - c] = dark;
              bitIndex--;
              if (bitIndex == -1) { byteIndex++; bitIndex = 7; }
            }
          }
          row += inc;
          if (row < 0 || this.moduleCount <= row) { row -= inc; inc = -inc; break; }
        }
      }
    }
  };
  QRCodeModel.PAD0 = 0xEC;
  QRCodeModel.PAD1 = 0x11;
  QRCodeModel.createData = function(typeNumber, errorCorrectLevel, dataList) {
    var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
    var buffer = new QRBitBuffer();
    for (var i = 0; i < dataList.length; i++) {
      var data = dataList[i];
      buffer.put(data.mode, 4);
      buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
      data.write(buffer);
    }
    var totalDataCount = 0;
    for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
    if (buffer.getLengthInBits() > totalDataCount * 8) {
      throw new Error("code length overflow. (" + buffer.getLengthInBits() + ">" + totalDataCount * 8 + ")");
    }
    if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) buffer.put(0, 4);
    while (buffer.getLengthInBits() % 8 != 0) buffer.putBit(false);
    while (true) {
      if (buffer.getLengthInBits() >= totalDataCount * 8) break;
      buffer.put(QRCodeModel.PAD0, 8);
      if (buffer.getLengthInBits() >= totalDataCount * 8) break;
      buffer.put(QRCodeModel.PAD1, 8);
    }
    return QRCodeModel.createBytes(buffer, rsBlocks);
  };
  QRCodeModel.createBytes = function(buffer, rsBlocks) {
    var offset = 0;
    var maxDcCount = 0, maxEcCount = 0;
    var dcdata = new Array(rsBlocks.length);
    var ecdata = new Array(rsBlocks.length);
    for (var r = 0; r < rsBlocks.length; r++) {
      var dcCount = rsBlocks[r].dataCount;
      var ecCount = rsBlocks[r].totalCount - dcCount;
      maxDcCount = Math.max(maxDcCount, dcCount);
      maxEcCount = Math.max(maxEcCount, ecCount);
      dcdata[r] = new Array(dcCount);
      for (var i = 0; i < dcdata[r].length; i++) dcdata[r][i] = 0xff & buffer.buffer[i + offset];
      offset += dcCount;
      var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
      var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
      var modPoly = rawPoly.mod(rsPoly);
      ecdata[r] = new Array(rsPoly.getLength() - 1);
      for (var i = 0; i < ecdata[r].length; i++) {
        var modIndex = i + modPoly.getLength() - ecdata[r].length;
        ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
      }
    }
    var totalCodeCount = 0;
    for (var i = 0; i < rsBlocks.length; i++) totalCodeCount += rsBlocks[i].totalCount;
    var data = new Array(totalCodeCount);
    var index = 0;
    for (var i = 0; i < maxDcCount; i++) {
      for (var r = 0; r < rsBlocks.length; r++) {
        if (i < dcdata[r].length) data[index++] = dcdata[r][i];
      }
    }
    for (var i = 0; i < maxEcCount; i++) {
      for (var r = 0; r < rsBlocks.length; r++) {
        if (i < ecdata[r].length) data[index++] = ecdata[r][i];
      }
    }
    return data;
  };

  function getMinimumTypeNumber(errorCorrectLevel, dataList) {
    for (var typeNumber = 1; typeNumber <= 40; typeNumber++) {
      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
      var buffer = new QRBitBuffer();
      for (var i = 0; i < dataList.length; i++) {
        var data = dataList[i];
        buffer.put(data.mode, 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
        data.write(buffer);
      }
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
      if (buffer.getLengthInBits() <= totalDataCount * 8) return typeNumber;
    }
    throw new Error("Data too long for a QR code.");
  }

  var qrcode = function(typeNumber, errorCorrectLevel) {
    var ecLevel = QRErrorCorrectLevel[errorCorrectLevel] !== undefined ? QRErrorCorrectLevel[errorCorrectLevel] : QRErrorCorrectLevel.M;
    var model = null;
    var dataList = [];

    var api = {};
    api.addData = function(data) { dataList.push(new QR8bitByte(data)); model = null; };
    api.make = function() {
      var tn = typeNumber;
      if (!tn || tn < 1) tn = getMinimumTypeNumber(ecLevel, dataList);
      model = new QRCodeModel(tn, ecLevel);
      for (var i = 0; i < dataList.length; i++) model.addData(dataList[i].data);
      model.make();
    };
    api.isDark = function(row, col) { return model.isDark(row, col); };
    api.getModuleCount = function() { return model.getModuleCount(); };
    api.createSvgTag = function(cellSize, margin) {
      cellSize = cellSize || 4;
      margin = margin || 0;
      var size = model.getModuleCount() * cellSize + margin * 2;
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">';
      svg += '<rect width="100%" height="100%" fill="white"/>';
      for (var row = 0; row < model.getModuleCount(); row++) {
        for (var col = 0; col < model.getModuleCount(); col++) {
          if (model.isDark(row, col)) {
            var x = col * cellSize + margin;
            var y = row * cellSize + margin;
            svg += '<rect x="' + x + '" y="' + y + '" width="' + cellSize + '" height="' + cellSize + '" fill="black"/>';
          }
        }
      }
      svg += '</svg>';
      return svg;
    };
    return api;
  };

  qrcode.stringToBytes = function(s) {
    var bytes = [];
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c < 0x80) {
        bytes.push(c);
      } else if (c < 0x800) {
        bytes.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
      } else if (c < 0xd800 || c >= 0xe000) {
        bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
      } else {
        i++;
        var c2 = 0x10000 + ((c & 0x3ff) << 10) + (s.charCodeAt(i) & 0x3ff);
        bytes.push(0xf0 | (c2 >> 18), 0x80 | ((c2 >> 12) & 0x3f), 0x80 | ((c2 >> 6) & 0x3f), 0x80 | (c2 & 0x3f));
      }
    }
    return bytes;
  };

  return qrcode;
}();
</script>

<script>
(function(){
  var textEl = document.getElementById('qr-text');
  var eccEl = document.getElementById('qr-ecc');
  var sizeEl = document.getElementById('qr-size');
  var genBtn = document.getElementById('generate-btn');
  var pngBtn = document.getElementById('download-png-btn');
  var svgBtn = document.getElementById('download-svg-btn');
  var preview = document.getElementById('preview');
  var canvas = document.getElementById('qr-canvas');
  var errorMsg = document.getElementById('error-msg');
  var currentQr = null;

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
  }
  function clearError() {
    errorMsg.textContent = '';
    errorMsg.classList.remove('show');
  }

  function drawToCanvas(qr, cvs, px) {
    var count = qr.getModuleCount();
    var cellSize = px / count;
    cvs.width = px;
    cvs.height = px;
    var ctx = cvs.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = '#000000';
    for (var row = 0; row < count; row++) {
      for (var col = 0; col < count; col++) {
        if (qr.isDark(row, col)) {
          var x = Math.round(col * cellSize);
          var y = Math.round(row * cellSize);
          var w = Math.ceil(cellSize);
          ctx.fillRect(x, y, w, w);
        }
      }
    }
  }

  function generate() {
    clearError();
    var text = textEl.value.trim();
    if (!text) {
      showError('Please enter some text or a URL.');
      pngBtn.disabled = true;
      svgBtn.disabled = true;
      preview.style.display = 'none';
      return;
    }
    try {
      var qr = qrcode(0, eccEl.value);
      qr.addData(text);
      qr.make();
      currentQr = qr;
      drawToCanvas(qr, canvas, 240);
      preview.style.display = 'block';
      pngBtn.disabled = false;
      svgBtn.disabled = false;
    } catch (e) {
      showError('Could not generate a QR code for this input. Try shorter text or a lower error-correction level.');
      pngBtn.disabled = true;
      svgBtn.disabled = true;
      preview.style.display = 'none';
    }
  }

  function downloadPng() {
    if (!currentQr) return;
    var size = parseInt(sizeEl.value, 10);
    var offscreen = document.createElement('canvas');
    drawToCanvas(currentQr, offscreen, size);
    offscreen.toBlob(function(blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'qrcode-' + size + 'px.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }, 'image/png');
  }

  function downloadSvg() {
    if (!currentQr) return;
    var svgStr = currentQr.createSvgTag(10, 0);
    var blob = new Blob([svgStr], { type: 'image/svg+xml' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'qrcode.svg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  genBtn.addEventListener('click', generate);
  pngBtn.addEventListener('click', downloadPng);
  svgBtn.addEventListener('click', downloadSvg);
  textEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) generate();
  });

  generate();
})();
</script>
</body>
</html>
